[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pmescan"
version = "0.1.0"
description = "Scanner de sécurité pour PME francophones, avec rapport PDF en français clair."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "pmescan et ses contributeurs" }]
keywords = ["securite", "scanner", "pme", "tls", "dns", "cms", "pdf", "francophone"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: French",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
]
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "sslyze>=6.0",
    "dnspython>=2.6",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "weasyprint>=62",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "respx>=0.21",
    "types-PyYAML>=6.0",
]

[project.scripts]
pmescan = "pmescan.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["pmescan"]

# Inclut le fichier de textes YAML dans le paquet distribué (sinon absent de la roue).
[tool.hatch.build.targets.wheel.force-include]
"pmescan/i18n/fr.yaml" = "pmescan/i18n/fr.yaml"
"pmescan/rapport/modele.html" = "pmescan/rapport/modele.html"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true

# sslyze expose ses symboles publics sans __all__ : on autorise la ré-exportation implicite.
[[tool.mypy.overrides]]
module = "sslyze"
implicit_reexport = true

# weasyprint ne fournit pas de stubs de typage : on ignore l'absence de types.
[[tool.mypy.overrides]]
module = "weasyprint"
ignore_missing_imports = true
