[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pmescan"
version = "0.1.0"
description = "Scanner de sécurité pour PME francophones, avec rapport PDF en français clair."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "pmescan et ses contributeurs" }]
keywords = ["securite", "scanner", "pme", "tls", "dns", "cms", "pdf", "francophone"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: French",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
]
dependencies = [
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
pmescan = "pmescan.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["pmescan"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
