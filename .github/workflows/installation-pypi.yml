# Test d'installation propre depuis PyPI : vérifie que « pip install pmescan » fonctionne
# pour tout le monde, dans un environnement neuf, sur les trois systèmes courants.
# Aucun code du dépôt n'est utilisé : seul le paquet publié sur PyPI est installé.

name: Installation depuis PyPI

on:
  workflow_dispatch:            # lancement manuel (onglet Actions)
  release:
    types: [published]
  schedule:
    - cron: "0 6 * * 1"         # chaque lundi à 6 h UTC

permissions:
  contents: read

jobs:
  installation:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        shell: bash
    steps:
      - name: Installer Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Installer pmescan depuis PyPI (sans cache)
        run: python -m pip install --no-cache-dir pmescan

      - name: La commande démarre et affiche sa version
        run: |
          pmescan --version
          pmescan scan --help

      - name: Les fichiers de données sont bien dans le paquet
        run: |
          python - <<'EOF'
          import importlib.resources as ressources
          assert ressources.files("pmescan.i18n").joinpath("fr.yaml").is_file()
          assert ressources.files("pmescan.rapport").joinpath("modele.html").is_file()
          print("fr.yaml et modele.html présents")
          EOF

      - name: Un domaine invalide est refusé avec le code 2
        run: |
          code=0
          pmescan scan "https://exemple.com/chemin" || code=$?
          test "$code" -eq 2
